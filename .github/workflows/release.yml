name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ── Wheels (matrix) ─────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            hdf5-dir: /usr
            args: --release --manifest-path kaichi-py/Cargo.toml --out dist
            before-script-linux: yum install -y hdf5-devel
            artifact: wheels-linux-x86_64
          - name: macOS arm64
            runner: macos-latest
            hdf5-dir: /opt/homebrew/opt/hdf5
            args: --release --manifest-path kaichi-py/Cargo.toml --out dist --target aarch64-apple-darwin
            artifact: wheels-macos-arm64
          - name: macOS x86_64
            runner: macos-13
            hdf5-dir: /usr/local/opt/hdf5
            args: --release --manifest-path kaichi-py/Cargo.toml --out dist --target x86_64-apple-darwin
            artifact: wheels-macos-x86_64
    steps:
      - uses: actions/checkout@v6
      - name: Install HDF5
        if: runner.os == 'macOS'
        run: brew install hdf5
      - uses: PyO3/maturin-action@v1
        env:
          HDF5_DIR: ${{ matrix.hdf5-dir }}
        with:
          command: build
          args: ${{ matrix.args }}
          before-script-linux: ${{ matrix.before-script-linux }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist

  # ── Source distribution ──────────────────────────────────────────────────────
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path kaichi-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  # ── Publish to PyPI ──────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
