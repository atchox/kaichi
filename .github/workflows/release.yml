name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ── Linux x86_64 ────────────────────────────────────────────────────────────
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        env:
          HDF5_DIR: /usr
        with:
          command: build
          args: --release --manifest-path kaichi-py/Cargo.toml --out dist
          before-script-linux: yum install -y hdf5-devel
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist

  # ── macOS arm64 (Apple Silicon) ─────────────────────────────────────────────
  build-macos-arm:
    name: Build (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install HDF5
        run: brew install hdf5
      - uses: PyO3/maturin-action@v1
        env:
          HDF5_DIR: /opt/homebrew/opt/hdf5
        with:
          command: build
          args: --release --manifest-path kaichi-py/Cargo.toml --out dist --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: dist

  # ── macOS x86_64 (Intel) ────────────────────────────────────────────────────
  build-macos-x86:
    name: Build (macOS x86_64)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Install HDF5
        run: brew install hdf5
      - uses: PyO3/maturin-action@v1
        env:
          HDF5_DIR: /usr/local/opt/hdf5
        with:
          command: build
          args: --release --manifest-path kaichi-py/Cargo.toml --out dist --target x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-x86_64
          path: dist

  # ── Source distribution ──────────────────────────────────────────────────────
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path kaichi-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # ── Publish to PyPI ──────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: [build-linux, build-macos-arm, build-macos-x86, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
